<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obscure</title>
    <meta name="description" content="A customizable new tab page built around search and the sky.">

    <link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='35' stroke='%23ffcc00' stroke-width='20' fill='none'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=Fraunces:wght@400;600&family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body data-theme="void">
    <div id="app">

      <button id="settings-toggle" aria-label="Open settings" aria-expanded="false">⚙</button>

      <main id="stage">
        <form id="search-form" autocomplete="off">
          <span class="prompt">›</span>
          <input type="text" id="query" placeholder="search obscure..." autofocus autocomplete="off">
          <div class="engine-picker" id="engine-picker">
            <button type="button" id="engine-trigger" class="engine-trigger" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="engine-menu" id="engine-menu" hidden>
              <div class="engine-list" id="engine-list"></div>
              <div class="engine-add">
                <div class="engine-add-label">add engine</div>
                <input type="text" id="new-engine-name" placeholder="name">
                <input type="text" id="new-engine-url" placeholder="url ending in q=">
                <button type="button" id="new-engine-add">add</button>
              </div>
            </div>
          </div>
          <button type="submit">go</button>
        </form>

        <p id="greeting" hidden></p>

        <div id="clock" hidden></div>

        <div id="nasa-box">
          <h1 id="title">loading space stuff...</h1>
          <p id="desc"></p>
        </div>

        <div id="weather-box" hidden>
          <span id="weather-temp"></span>
          <span id="weather-desc"></span>
          <span id="weather-city"></span>
        </div>
      </main>

      <aside id="settings-panel" aria-hidden="true">
        <div class="panel-head">
          <span>settings</span>
          <button id="settings-close" aria-label="Close settings">×</button>
        </div>

        <section>
          <label class="section-label">theme</label>
          <div id="theme-swatches"></div>
        </section>

        <section>
          <label class="section-label" for="accent-custom">custom accent</label>
          <input type="color" id="accent-custom" value="#5eead4">
        </section>

        <section>
          <label class="section-label" for="blur-range">panel blur</label>
          <input type="range" id="blur-range" min="0" max="24" value="14">
        </section>

        <section>
          <label class="section-label">font</label>
          <div class="dropdown" id="font-dropdown">
            <button type="button" class="dropdown-trigger" id="font-trigger" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="dropdown-menu" id="font-menu" hidden>
              <div class="dropdown-list" id="font-list"></div>
            </div>
          </div>
        </section>

        <section>
          <label class="section-label">title & description</label>
          <div class="dropdown" id="text-length-dropdown">
            <button type="button" class="dropdown-trigger" id="text-length-trigger" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="dropdown-menu" id="text-length-menu" hidden>
              <div class="dropdown-list" id="text-length-list"></div>
            </div>
          </div>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-textbox" checked>
            background box behind text
          </label>
          <input type="range" id="textbox-opacity" min="0" max="90" value="35">
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-hd">
            use hd image (slower)
          </label>
        </section>

        <section>
          <label class="section-label">background date</label>
          <div class="dropdown" id="date-mode-dropdown">
            <button type="button" class="dropdown-trigger" id="date-mode-trigger" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="dropdown-menu" id="date-mode-menu" hidden>
              <div class="dropdown-list" id="date-mode-list"></div>
            </div>
          </div>
          <input type="date" id="date-custom" hidden>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-weather">
            show weather
          </label>
          <input type="text" id="weather-city-input" placeholder="city (leave blank to use location)" hidden>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-clock">
            show clock
          </label>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-greeting">
            show greeting
          </label>
          <input type="text" id="greeting-name" placeholder="your name (optional)" hidden>
        </section>

        <button id="settings-reset">reset to defaults</button>
      </aside>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
