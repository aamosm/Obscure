<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Obscure</title>
    <meta name="description" content="A customizable new tab page built around search.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='35' stroke='%23ffcc00' stroke-width='20' fill='none'/%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=Fraunces:wght@400;600&family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body data-theme="void">
    <div id="app">

      <button id="settings-toggle" class="surface-float" aria-label="Open settings" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="4" y1="5" x2="16" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="5" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.4"/>
          <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="7" cy="10" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.4"/>
          <line x1="4" y1="15" x2="16" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="14" cy="15" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>

      <main id="stage">
        <form id="search-form" autocomplete="off">
          <span class="prompt">›</span>
          <input type="text" id="query" placeholder="search obscure..." autofocus autocomplete="off">

          <div class="dropdown dropdown--inline" id="engine-picker">
            <button type="button" id="engine-trigger" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-label"></span>
              <svg class="chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-menu surface-float" id="engine-menu" hidden>
              <div class="dropdown-list" id="engine-list"></div>
              <div class="dropdown-add">
                <div class="dropdown-add-label">add engine</div>
                <input type="text" id="new-engine-name" placeholder="name">
                <input type="text" id="new-engine-url" placeholder="url ending in q=">
                <button type="button" id="new-engine-add">add</button>
              </div>
            </div>
          </div>

          <button type="submit">go</button>
        </form>

        <p id="greeting" hidden></p>

        <div id="clock" hidden></div>

        <div id="nasa-box">
          <h1 id="title">loading space stuff...</h1>
          <p id="desc"></p>
        </div>

        <div id="weather-box" hidden>
          <span id="weather-temp"></span>
          <span id="weather-desc"></span>
          <span id="weather-city"></span>
        </div>
      </main>

      <aside id="settings-panel" class="surface-float" aria-hidden="true">
        <div class="panel-head">
          <span>settings</span>
          <button id="settings-close" aria-label="Close settings">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <section>
          <label class="section-label">theme</label>
          <div id="theme-swatches"></div>
        </section>

        <section>
          <label class="section-label" for="accent-custom">custom accent</label>
          <input type="color" id="accent-custom" value="#5eead4">
        </section>

        <section>
          <label class="section-label" for="blur-range">panel blur</label>
          <input type="range" id="blur-range" min="0" max="24" value="14">
        </section>

        <section>
          <label class="section-label" id="font-label">font</label>
          <div class="dropdown dropdown--block" id="font-select">
            <button type="button" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="font-label">
              <span class="dd-label"></span>
              <svg class="chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-menu surface-float" hidden>
              <div class="dropdown-list"></div>
            </div>
          </div>
        </section>

        <section>
          <label class="section-label" id="text-length-label">title & description</label>
          <div class="dropdown dropdown--block" id="text-length">
            <button type="button" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="text-length-label">
              <span class="dd-label"></span>
              <svg class="chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-menu surface-float" hidden>
              <div class="dropdown-list"></div>
            </div>
          </div>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-textbox" checked>
            background box behind text
          </label>
          <input type="range" id="textbox-opacity" min="0" max="90" value="35">
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-hd">
            use hd image (slower)
          </label>
        </section>

        <section>
          <label class="section-label" id="date-mode-label">background date</label>
          <div class="dropdown dropdown--block" id="date-mode">
            <button type="button" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="date-mode-label">
              <span class="dd-label"></span>
              <svg class="chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-menu surface-float" hidden>
              <div class="dropdown-list"></div>
            </div>
          </div>
          <input type="date" id="date-custom" hidden>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-weather">
            show weather
          </label>
          <input type="text" id="weather-city-input" placeholder="city (leave blank to use location)" hidden>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-clock">
            show clock
          </label>
        </section>

        <section>
          <label class="section-label">
            <input type="checkbox" id="toggle-greeting">
            show greeting
          </label>
          <input type="text" id="greeting-name" placeholder="your name (optional)" hidden>
        </section>

        <button id="settings-reset">reset to defaults</button>
      </aside>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
